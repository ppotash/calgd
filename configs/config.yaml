defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: openwebtext
  - /model: small
  - /strategy: ddp
  - /noise: loglinear
  - /lr_scheduler: constant_warmup

mode: train  # train / ppl_eval / sample_eval
diffusion: absorbing_state
backbone: dit  # dit / dimamba / ar
parameterization: subs  # subs / d3pm / sedd
time_conditioning: False
T: 0  # 0 (continuous time) / 1000 
subs_masking: False

seed: 1

loader:
  global_batch_size: 512
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ddpm_cache  # analytic, ddpm, ddpm_cache, ordered
  order: confidence  # for predictor=ordered: confidence, random
  confidence_temp: 0.0  # order=confidence: Gumbel noise scale at t=1, annealed to 0 (MaskGIT uses 4.5)
  fp64: True  # float64 Gumbel sampling (avoids fp32 truncation artifacts)
  sweep_steps: [8, 16, 32, 64, 128]  # for mode=sample_sweep
  revealer_path: null  # order=revealer: trained head checkpoint
  revealer_temp: 0.0  # order=revealer: Gumbel noise scale at t=1, annealed to 0
  steps: 128
  noise_removal: True
  # TODO(yair): @subham, why aren't these params under `eval`?
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False

eval:
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 1_000_000
  log_every_n_steps: 10
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 10000

wandb:
  project: text-diffusion
  notes: Mulan for text
  group: null
  job_type: null
  name: null
  id: ${.name}_${seed}
  tags:
    - ${noise.type}
    - ${data.train}
    - ${data.valid}

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt

revealer:  # mode=revealer_label / revealer_train
  label_dir: null  # where labeled shards go (put it on Drive)
  n_shards: 20
  shard_size: 256  # labeled sequences per shard
  batch_size: 4  # sequences per labeling step
  k: 8  # candidates per sequence
  n_samples: 4  # sampled reveals per candidate (averaging reduces label noise)
  chunk: 8  # counterfactual sequences per forward pass (lower if OOM)
  ground_truth: False  # reveal true tokens instead of sampled ones
  allow_tf32: True  # faster labeling on Ampere/Ada GPUs
  val_shards: 2  # first shards held out for validation
  head_path: null  # default: <label_dir>/revealer_head.pt
  target: sampled  # sampled: gain of the committed value; expected: mean over samples
  base: cand  # null, cand (sampled-token prob) or maxp: head corrects this score
  use_hidden: True  # False = features-only ablation
  width: 128
  dropout: 0.2
  weight_decay: 0.05
  epochs: 50
  patience: 5  # early stopping on validation pair accuracy
  lr: 3e-4
  train_batch: 256
  margin: 0.0
  seed: 0

latent:  # mode=latent_finetune; latent.ckpt_path also used by sample_sweep
  bits: 16  # 0 = matched control (adaLN fine-tune, no latent)
  beta: 0.1  # KL weight in training (1 collapses the latent); bounds use full KL
  free_bits: 0.0  # optional KL floor per bit (nats)
  kl_warmup: 0.2  # fraction of steps over which beta ramps up
  enc_dim: 256
  enc_layers: 2
  enc_heads: 4
  enc_head_std: 0.02  # encoder output init; ~1 makes bits a random hash of the text from step 0
  freeze_encoder: False  # keep the (random-hash) encoder fixed; train only how z is used
  input_inject: False  # also add z to every token embedding (direct path into the trunk)
  steps: 2000
  batch_size: 8
  grad_accum: 2
  lr: 1e-4  # adaLN layers
  new_lr_mult: 3.0  # encoder and z projection get lr * this
  warmup: 100
  allow_tf32: True
  log_every: 25
  eval_every: 250
  eval_seqs: 128  # held-out sequences (taken from the start of the stream)
  eval_repeats: 2
  save_dir: null
  ckpt_path: null  # trained adapter (final.pt) for sample_sweep
  seed: 0
